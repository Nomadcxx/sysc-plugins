name: Release

on:
  push:
    tags:
      - '*-v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  # Builds the tagged plugin for both arches and uploads each archive as a
  # workflow artifact. The tag itself, "<dir>-v<version>", names the plugin
  # and version; every later job re-derives them the same way.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Parse tag
        id: tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "dir=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "tag '$tag' is not <dir>-v<version>" >&2
            exit 1
          fi
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          go run ./tools/catalog package \
            -plugin "${{ steps.tag.outputs.dir }}" \
            -arch "${{ matrix.arch }}" \
            -out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # Publishes the GitHub release carrying both arch tarballs. --verify-tag
  # refuses to create the release if the tag this workflow ran for has
  # somehow gone missing by the time this job runs.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/* \
            --title "$tag" \
            --notes "Automated release for $tag." \
            --verify-tag

  # Regenerates catalog.json for the published release and opens a PR
  # against main carrying it. CI never pushes to main directly (Owner
  # decisions): the catalog PR always needs a human merge.
  catalog:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Update and validate catalog
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          go run ./tools/catalog update -tag "$tag" -dist dist
          go run ./tools/catalog validate -fetch
      - name: Open catalog PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          branch="catalog/$tag"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add catalog.json
          git commit -m "catalog: $tag"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --title "catalog: $tag" \
            --body "Generated by the release workflow for $tag."
