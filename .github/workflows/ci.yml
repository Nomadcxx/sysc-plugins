name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The calendar plugin reads Evolution Data Server through cgo, so vet,
      # test and build all need libecal's headers and pkg-config file.
      - name: install libecal
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libecal2.0-dev
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build plugins
        run: make build
      - name: validate manifests
        run: go run ./tools/validate-manifests
      - name: validate catalog
        run: go run ./tools/catalog validate
