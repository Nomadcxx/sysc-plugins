name: CI
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!LICENSE'
      - '!**/*.png'
      - '!**/*.jpg'
      - '!**/*.jpeg'
      - '!**/*.gif'
      - '!**/*.svg'
      - '!**/*.webp'
      # Manifests, thumbnails and plugin bundles ship images that CI validates.
      - 'plugins/*/screenshot.*'
      - 'plugins/*/thumbnail.*'
      - 'plugins/**/assets/**'
      - 'internal/thumbnail/assets/**'
      - '**/testdata/**'
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
      - '!LICENSE'
      - '!**/*.png'
      - '!**/*.jpg'
      - '!**/*.jpeg'
      - '!**/*.gif'
      - '!**/*.svg'
      - '!**/*.webp'
      - '!catalog.json'
      - 'plugins/*/screenshot.*'
      - 'plugins/*/thumbnail.*'
      - 'plugins/**/assets/**'
      - 'internal/thumbnail/assets/**'
      - '**/testdata/**'
      # Catalog-only PRs are opened by the release workflow with GITHUB_TOKEN.
      # That token cannot start pull_request workflows, so GitHub records a
      # failed empty run ("workflow file issue") for every catalog PR. Those
      # PRs are already checked with `catalog validate -fetch` in release.yml.
  # The release workflow calls this one to re-run the same checks against the
  # tagged commit. A called run is pinned to the tag, so the tree under test
  # is the tree that ships. The path filters above do not apply here.
  workflow_call:

# Supersede in-flight runs for the same branch or PR so a burst of pushes does
# not queue a full build each. Default-branch pushes are exempt: every merge to
# main gets its own full run and verdict instead of a "cancelled" result.
concurrency:
  # The suffix names the workflow file rather than the run. A called workflow
  # sees the caller's workflow name, and an unsuffixed group would be shared
  # by the release run and by the checks it calls, so the two would cancel
  # each other.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The calendar plugin reads Evolution Data Server through cgo, so vet,
      # test and build all need libecal's headers and pkg-config file.
      - name: install libecal
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libecal2.0-dev libjson-glib-dev
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      # staticcheck catches the correctness classes (SA/S1/U1000) that go vet
      # does not. Run via `go run` so no linter enters go.mod. Pinned to
      # @latest because 2025-era pins cannot parse Go 1.26 export data.
      # Check selection and its rationale live in staticcheck.conf.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build plugins
        run: make build STRICT=1
      - name: validate manifests
        run: go run ./tools/validate-manifests
      - name: check thumbnails
        run: go run ./tools/thumbnail -check
      - name: validate catalog
        run: go run ./tools/catalog validate

  verify:
    uses: Nomadcxx/.github/.github/workflows/go-verify.yml@cd88b2e0b04be9dee5a2becf3a4586b108dd9c11
    with:
      go-version-file: go.mod
      run-build: true
      extra-setup: true
