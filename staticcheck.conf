# staticcheck configuration, read automatically from the repo root.
#
# The list restates staticcheck's own defaults (so a future default change
# cannot silently alter the gate) and then adds the one check this repo
# deliberately opts out of.
#
# ST1005 ("error strings should not be capitalized") assumes an error string
# is concatenated into other output. Here they are sentence-case user-facing
# copy — e.g. notes' "Moved or deleted outside Notes" is rendered verbatim in
# the note pane. Rewriting them to satisfy the convention would change what
# users read for no benefit.
checks = ["all",
    "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023",
    "-ST1005"]